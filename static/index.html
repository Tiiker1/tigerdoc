<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
    try {
      if (localStorage.getItem("dashboard-theme") === "light") {
        document.documentElement.classList.add("theme-light");
      }
    } catch (_) {}
  </script>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">&#x25A6;</span>
      <h1>Docker Dashboard</h1>
      <span class="dot" id="connDot" title="connection"></span>
    </div>
    <div class="engine" id="engineInfo">connecting&hellip;</div>
    <div class="top-actions">
      <button id="themeToggle" class="btn btn-theme" title="toggle light/dark mode" aria-label="toggle light/dark mode">&#9790;</button>
      <button id="autoToggle" class="btn btn-toggle on" title="toggle auto refresh">auto&#x2212;refresh</button>
      <button id="refreshBtn" class="btn" title="refresh now">&#x21bb;</button>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="filter by name, image or id" autocomplete="off" spellcheck="false">
      <div class="seg" id="stateFilter" role="group" aria-label="filter by state">
        <button class="seg-btn active" data-state="all">all</button>
        <button class="seg-btn" data-state="running">running</button>
        <button class="seg-btn" data-state="paused">paused</button>
        <button class="seg-btn" data-state="stopped">stopped</button>
      </div>
      <div class="count" id="count">0 containers</div>
    </div>

    <div id="statusLine" class="status hidden"></div>

    <div class="table-card">
      <table id="containers" class="ctable">
        <thead>
          <tr>
            <th class="col-state">state</th>
            <th class="col-name">name</th>
            <th class="col-img">image</th>
            <th class="col-status">status</th>
            <th class="col-ports">ports</th>
            <th class="col-created">created</th>
            <th class="col-actions">actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty hidden">no containers</div>
      <div id="loading" class="empty">loading&hellip;</div>
    </div>

    <footer class="foot">LAN only &#183; containers are controlled directly on the Docker socket <span id="buildTag"></span></footer>
  </main>

  <div id="logModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title">
          <span class="dot dot-live hidden" id="liveDot"></span>
          <span id="logTitle">logs</span>
        </div>
        <div class="modal-tools">
          <label class="chk"><input type="checkbox" id="logFollow" checked> follow</label>
          <label class="chk"><input type="checkbox" id="logTs"> timestamps</label>
          <select id="logTail" class="sel" title="lines to load">
            <option value="100">tail 100</option>
            <option value="500" selected>tail 500</option>
            <option value="2000">tail 2000</option>
            <option value="all">all</option>
          </select>
          <button id="logClear" class="btn btn-sm" title="clear view">&#215;</button>
          <button id="logCopy" class="btn btn-sm" title="copy to clipboard">&#10697;</button>
          <button id="logClose" class="btn btn-sm btn-x" title="close (Esc)">&#215; close</button>
        </div>
      </div>
      <div class="log-wrap">
        <pre id="logOutput"><span class="muted">connecting&hellip;</span></pre>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
