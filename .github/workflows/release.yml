name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"

      - name: Build Linux binaries
        run: |
          set -eux
          mkdir -p dist
          VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
          BUILD="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X main.version=$VERSION -X main.buildTime=$BUILD"
          build() {
            CGO_ENABLED=0 GOOS=linux GOARCH="$1" GOARM="$2" \
              go build -trimpath -ldflags="-s -w $LDFLAGS" \
              -o "dist/docker-dashboard-linux-$3" .
          }
          build amd64 "" amd64
          build arm64 "" arm64
          build arm   "7" armv7
          ls -lh dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum docker-dashboard-linux-* > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
